# ════════════════════════════════════════════════════════════════════
#  GauthierFitness Backend - CI
#  repo : CharlesGAUTHIER1999/gauthierfitness-backend
#  Séquence : PHPUnit → Pint → Build image GHCR → Trigger deploy infra
# ════════════════════════════════════════════════════════════════════

name: CI Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/charlesgauthier1999/gauthierfitness-backend

# -----------------------
# JOB 1 - Tests PHPUnit
# -----------------------
jobs:
  phpunit:
    name: "PHPUnit"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, bcmath, gd, zip, pcntl
          coverage: pcov

      - name: Préparer les dossiers Laravel
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/{cache,sessions,views}
          mkdir -p storage/logs
          chmod -R 777 bootstrap/cache storage

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: PHPUnit (Unit + Feature) avec coverage
        run: php artisan test --stop-on-failure --coverage --coverage-clover=coverage.xml
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Upload rapport de coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # --------------------------
  # JOB 2 - Linter PHP (Pint)
  # --------------------------
  lint:
    name: "Laravel Pint"
    runs-on: ubuntu-latest
    needs: phpunit

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Pint (vérification style)
        run: ./vendor/bin/pint --test

  # ---------------------------------------------
  # JOB 3 - Build & Push image GHCR (push only)
  # ---------------------------------------------
  build:
    name: "Build image backend"
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------------------
  # JOB 4 - Déclenchement du deploy dans gauthierfitness-infra (only on develop)
  # ------------------------------------------------------------------------------
  trigger-deploy:
    name: "Trigger deploy infra"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Dispatch vers gauthierfitness-infra
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: CharlesGAUTHIER1999/gauthierfitness-infra
          event-type: deploy-staging
          client-payload: |
            {
              "image_tag": "${{ needs.build.outputs.image_tag }}",
              "service": "backend",
              "branch": "${{ github.ref_name }}"
            }
