; Overrides the default pool sizing (pm.max_children=5), which is far too
; small for the VPS specs (6 CPU / 11 GB RAM) and causes requests to queue
; behind PHP-FPM under concurrent load — the DB/app logic itself is fast
; (~10ms per request per query log), the bottleneck was the worker pool.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
