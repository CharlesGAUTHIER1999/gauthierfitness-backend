services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gf_backend_app
    volumes:
      - ./:/var/www/html
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # vendor/autoload.php only exists once the entrypoint's composer install
      # (see docker/entrypoint.sh) has finished — first boot on a fresh clone.
      test: ["CMD", "test", "-f", "vendor/autoload.php"]
      interval: 3s
      timeout: 3s
      retries: 60

  nginx:
    image: nginx:alpine
    container_name: gf_backend_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: gf_backend_db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - gf_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gf_mysql:
